name: Flutter package

on:
  push:
    paths:
      - "packages/source_sidebar_flutter/**"
      - "demo/**"
      - "scripts/vercel-build.sh"
      - "vercel.json"
      - ".github/workflows/flutter-package.yml"
  pull_request:
    paths:
      - "packages/source_sidebar_flutter/**"
      - "demo/**"
      - "scripts/vercel-build.sh"
      - "vercel.json"
      - ".github/workflows/flutter-package.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/source_sidebar_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
